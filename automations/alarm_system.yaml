- id: 'security_camera_coordinator'
  alias: Security - Camera Coordinator
  description: >-
    Unified security pipeline. t=0: immediate awareness push + start frame
    collection. Submits footage to LLM timed to finish just as each stage
    deadline hits, so Stage 1 and Stage 2 push notifications include a
    pre-computed AI summary with no lag. Single push tag (always latest);
    emails carry the running timeline. Frame collection timing is driven by
    input_number helpers so nothing needs redeployment to retune.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: group.property_person
      to: 'on'
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state:
        - armed_away
        - armed_home
  variables:
    cam_map:
      binary_sensor.doorbell_smart_person:
        camera: sensor.doorbell_smart_camera
        name: Doorbell
      binary_sensor.front_left_smart_person:
        camera: sensor.front_left_smart_camera
        name: Front Left
      binary_sensor.front_right_smart_person:
        camera: sensor.front_right_smart_camera
        name: Front Right
      binary_sensor.back_left_smart_person:
        camera: sensor.back_left_smart_camera
        name: Back Left
      binary_sensor.back_right_smart_person:
        camera: sensor.back_right_smart_camera
        name: Back Right
    active_ids: >-
      {{ expand('group.property_person') | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
    primary_id: "{{ (active_ids + ['binary_sensor.doorbell_smart_person'])[0] }}"
    active_names: >-
      {% set ns = namespace(n=[]) %}
      {% for e in active_ids %}{% set ns.n = ns.n + [cam_map[e].name] %}{% endfor %}
      {{ ns.n | join(', ') if ns.n | count > 0 else cam_map[primary_id].name }}
    camera_entity: "{{ states(cam_map[primary_id].camera) }}"
    event_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
    awareness_time: "{{ now().strftime('%I:%M:%S %p') }}"
    # Timing — read once at trigger so the mode:single cooldown uses a consistent set.
    stage1_delay: "{{ states('input_number.security_stage_1_alert_seconds') | int(60) }}"
    stage2_delay: "{{ states('input_number.security_stage_2_alarm_seconds') | int(300) }}"
    llm_lead: "{{ states('input_number.security_llm_lead_time_seconds') | int(8) }}"
    frame_interval: "{{ states('input_number.security_frame_interval_seconds') | int(10) }}"
    # Stage 1 frame collection: shoot primary-cam frames for (stage1_delay - llm_lead) seconds.
    # s1_padding fills any gap left after the last full frame_interval before LLM submission.
    collection_rounds_s1: "{{ [((stage1_delay - llm_lead) / frame_interval) | int(0), 0] | max }}"
    s1_padding: "{{ [(stage1_delay - llm_lead) - (collection_rounds_s1 * frame_interval), 0] | max | int }}"
    # Stage 2 frame collection: from stage1_delay to (stage2_delay - llm_lead).
    s2_collect_window: "{{ [stage2_delay - stage1_delay - llm_lead, 0] | max }}"
    collection_rounds_s2: "{{ [(s2_collect_window / frame_interval) | int(0), 0] | max }}"
    s2_padding: "{{ [s2_collect_window - (collection_rounds_s2 * frame_interval), 0] | max | int }}"
    # File paths. Init snapshots cover all active cameras; subsequent frames are primary only.
    frame_base: "/media/llmvision/security/{{ event_ts }}"
    init_shots: >-
      {% set ns = namespace(s=[]) %}
      {% set ids = active_ids if active_ids | count > 0 else [primary_id] %}
      {% for e in ids %}
        {% set ns.s = ns.s + [{'cam': states(cam_map[e].camera), 'file': frame_base + '_init_' + cam_map[e].name | slugify + '.jpg'}] %}
      {% endfor %}
      {{ ns.s }}
    init_files: "{{ init_shots | map(attribute='file') | list }}"
    # Precomputed LLM file lists (newline-separated; llmvision splits on \n).
    # s1: init snapshots + stage-1 collection frames.
    # s2: entire event — init + all s1 + all s2 frames.
    s1_llm_files: >-
      {% set ns = namespace(files=init_files) %}
      {% for i in range(1, collection_rounds_s1 + 1) %}
        {% set ns.files = ns.files + [frame_base + '_f' + i|string + '.jpg'] %}
      {% endfor %}
      {{ ns.files | join('\n') }}
    s2_llm_files: >-
      {% set ns = namespace(files=init_files) %}
      {% for i in range(1, collection_rounds_s1 + collection_rounds_s2 + 1) %}
        {% set ns.files = ns.files + [frame_base + '_f' + i|string + '.jpg'] %}
      {% endfor %}
      {{ ns.files | join('\n') }}
  action:
    # ── STAGE 0: AWARENESS (t=0) ─────────────────────────────────────────────
    - repeat:
        for_each: "{{ init_shots }}"
        sequence:
          - action: camera.snapshot
            target:
              entity_id: "{{ repeat.item.cam }}"
            data:
              filename: "{{ repeat.item.file }}"
    # Only notify at awareness stage when away — armed_home gets Stage 1/2 alerts
    # only (otherwise every passerby pings you while you're home).
    - if:
        - condition: state
          entity_id: alarm_control_panel.alarmo
          state: armed_away
      then:
        # warn + force_email rather than critical: the Alexa announce is
        # deliberately held back until Stage 1, so a passer-by does not set the
        # house talking at t=0.
        - action: script.notify
          data:
            audience: house_admins
            severity: warn
            category: security
            tag_suffix: alert
            force_email: true
            title: "Person at {{ active_names }}"
            message: "Detected — collecting footage for AI analysis..."
            push_data:
              image: "/api/camera_proxy/{{ camera_entity }}"
            email_title: "Security Alert: Person detected at {{ active_names }}"
            email_message: "Person first detected at {{ awareness_time }} at {{ active_names }}."
            email_images: "{{ init_files }}"

    # ── STAGE 1: COLLECT → PAD → LLM → ALERT ────────────────────────────────
    # Collect primary-camera frames every frame_interval seconds until
    # (stage1_delay - llm_lead) seconds have elapsed, then pad any remainder
    # so the LLM submission lands exactly at (stage1_delay - llm_lead).
    - repeat:
        count: "{{ collection_rounds_s1 }}"
        sequence:
          - delay:
              seconds: "{{ frame_interval }}"
          - action: camera.snapshot
            target:
              entity_id: "{{ camera_entity }}"
            data:
              filename: "{{ frame_base }}_f{{ repeat.index }}.jpg"
    - delay:
        seconds: "{{ s1_padding }}"
    # LLM receives all footage from t=0. Should return by stage1_delay.
    - action: llmvision.image_analyzer
      data:
        provider: 01KHDH36JH319D6FP251VYXE80
        image_file: "{{ s1_llm_files }}"
        message: >-
          Security camera footage from the past {{ stage1_delay }} seconds across
          {{ active_names }} ({{ s1_llm_files.split('\n') | reject('eq','') | list | count }} frames).
          Describe what is happening in 2-3 sentences focusing on the person's
          behavior and location. Be concise and factual.
        store_in_timeline: false
        expose_images: true
      response_variable: s1_llm_result
    - variables:
        s1_summary: "{{ s1_llm_result.response_text | default('Person detected — analysis unavailable.') }}"
        lingering_time: "{{ now().strftime('%I:%M:%S %p') }}"
    # Only alert if person is still present (mirrors original for: trigger behavior).
    - if:
        - condition: state
          entity_id: group.property_person
          state: 'on'
      then:
        - action: script.notify
          data:
            audience: house_admins
            severity: critical
            category: security
            tag_suffix: alert
            title: "Still here: Person at {{ active_names }}"
            message: "{{ s1_summary }}"
            push_data:
              image: "/api/camera_proxy/{{ camera_entity }}"
            alexa_message: >-
              Alert: A person has been lingering at {{ active_names }} for
              {{ stage1_delay }} seconds.
            email_title: "Lingering Alert: Person at {{ active_names }}"
            email_message: >-
              Timeline:
              {{ awareness_time }} — Person first detected at {{ active_names }}.
              {{ lingering_time }} — Still present after {{ stage1_delay }}s.

              AI Analysis ({{ stage1_delay }}s of footage): {{ s1_summary }}
            email_images: "{{ s1_llm_files.split('\n') | reject('eq', '') | list }}"

        # ── STAGE 2: COLLECT → PAD → LLM → ALARM ────────────────────────────
        # Continue collecting from stage1_delay to (stage2_delay - llm_lead).
        - repeat:
            count: "{{ collection_rounds_s2 }}"
            sequence:
              - delay:
                  seconds: "{{ frame_interval }}"
              - action: camera.snapshot
                target:
                  entity_id: "{{ camera_entity }}"
                data:
                  filename: "{{ frame_base }}_f{{ repeat.index + collection_rounds_s1 }}.jpg"
        - delay:
            seconds: "{{ s2_padding }}"
        # LLM receives all frames from the entire event. Should return by stage2_delay.
        - action: llmvision.image_analyzer
          data:
            provider: 01KHDH36JH319D6FP251VYXE80
            image_file: "{{ s2_llm_files }}"
            message: >-
              Security camera footage spanning the full {{ stage2_delay }}-second event
              across {{ active_names }} ({{ s2_llm_files.split('\n') | reject('eq','') | list | count }} frames).
              Describe the complete sequence of events in 2-3 sentences. Be concise and factual.
            store_in_timeline: false
            expose_images: true
          response_variable: s2_llm_result
        - variables:
            s2_summary: "{{ s2_llm_result.response_text | default('Person still present — analysis unavailable.') }}"
            critical_time: "{{ now().strftime('%I:%M:%S %p') }}"
        - if:
            - condition: state
              entity_id: group.property_person
              state: 'on'
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.master_siren_toggle
            # warn + force_email, not critical: flipping the siren toggle above
            # fires "Security - Siren Response ON", which owns the Alexa
            # announce. Using critical here would announce twice.
            - action: script.notify
              data:
                audience: house_admins
                severity: warn
                category: security
                tag_suffix: alert
                force_email: true
                title: "CRITICAL: Intruder at {{ active_names }}"
                message: "{{ s2_summary }}"
                email_title: "CRITICAL ALARM: {{ active_names }}"
                email_message: >-
                  Timeline:
                  {{ awareness_time }} — Person first detected at {{ active_names }}.
                  {{ lingering_time }} — Lingering after {{ stage1_delay }}s — {{ s1_summary }}
                  {{ critical_time }} — CRITICAL after {{ stage2_delay }}s.

                  Full AI Analysis: {{ s2_summary }}
                email_images: "{{ s2_llm_files.split('\n') | reject('eq', '') | list }}"

    # ── COOLDOWN ──────────────────────────────────────────────────────────────
    # Keep this instance running so mode:single drops any re-triggers.
    - delay:
        minutes: "{{ states('input_number.security_alert_cooldown_minutes') | int(5) }}"

- id: 'security_alarmo_triggered'
  alias: Security - Alarmo Triggered
  description: >-
    Activates sirens when Alarmo itself trips (e.g. door/window sensor breach).
    Kept separate from the camera coordinator so hardware-sensor alarms fire
    instantly without waiting for the camera pipeline.
  mode: single
  trigger:
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: triggered
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.master_siren_toggle

- id: '1780204799287'
  alias: Security - Disarm Stops Sirens
  description: Instantly turns OFF the Master Siren Toggle when Alarmo is disarmed.
  mode: single
  trigger:
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: disarmed
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.master_siren_toggle

- id: '1780204799999'
  alias: Security - Siren Response ON
  description: Fires all sirens and notifications when the Master Siren Toggle is turned on.
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.master_siren_toggle
      to: 'on'
  action:
    - if:
        - condition: state
          entity_id: input_boolean.sirens_enabled
          state: 'on'
      then:
        - action: siren.turn_on
          target:
            entity_id:
              - siren.doorbell_siren
              - siren.front_left_siren
              - siren.front_right_siren
              - siren.living_room_siren
              - siren.back_right_siren
    - action: script.notify
      data:
        audience: house_admins
        severity: critical
        category: security
        tag_suffix: siren
        title: CRITICAL ALARM!
        message: SIRENS ACTIVATED!
        alexa_message: Warning! Intruder detected! Authorities have been notified!
        email_title: CRITICAL ALARM TRIGGERED!
        email_message: Sirens have been activated. Immediate attention required.

- id: '1780204800000'
  alias: Security - Siren Response OFF
  description: Stops all sirens when the Master Siren Toggle is turned off.
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.master_siren_toggle
      to: 'off'
  action:
    - action: siren.turn_off
      target:
        entity_id:
          - siren.doorbell_siren
          - siren.front_left_siren
          - siren.front_right_siren
          - siren.living_room_siren
          - siren.back_right_siren

- id: '1780204799409'
  alias: Auto Disarm When Phone Arrives
  description: Disarms the alarm automatically when the Pixel 8 Pro arrives home.
  mode: single
  trigger:
    - platform: state
      entity_id: person.cherpin
      to: home
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  action:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.alarmo
    - action: script.notify
      data:
        audience: house_admins
        severity: info
        category: security
        tag_suffix: arm_state
        title: Alarm Disarmed
        message: Welcome home. The alarm has been automatically disarmed.

- id: '1780204799500'
  alias: Auto Arm Home at Night
  description: Automatically secures the perimeter at night, or 15 minutes after late arrivals/disarming.
  mode: single
  trigger:
    - platform: time
      at: "22:00:00"
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: disarmed
      for:
        minutes: 15
  condition:
    - condition: time
      after: "21:59:59"
      before: "06:00:00"
    - condition: state
      entity_id: person.cherpin
      state: home
  action:
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.alarmo
    - action: script.notify
      data:
        audience: house_admins
        severity: info
        category: security
        tag_suffix: arm_state
        title: House Armed for the Night
        message: The perimeter has been automatically secured (Armed Home).
