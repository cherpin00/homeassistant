- id: '1780204796679'
  alias: Security - Stage 0 (Awareness)
  description: >-
    Instant snapshot + AI summary + email the moment a person appears on the
    property while armed away. Property-wide (one alert no matter how many
    cameras see them); snapshots every active camera; mode:single + a trailing
    delay enforces a cooldown so repeat detections don't spam.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: group.property_person
      to: 'on'
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  variables:
    cam_map:
      binary_sensor.doorbell_smart_person:
        fluent: camera.doorbell_fluent
        name: Doorbell
      binary_sensor.front_left_smart_person:
        fluent: camera.front_left_fluent_lens_0
        name: Front Left
      binary_sensor.front_right_smart_person:
        fluent: camera.front_right_fluent_lens_0
        name: Front Right
      binary_sensor.back_left_smart_person:
        fluent: camera.living_room_fluent_lens_0
        name: Back Left
      binary_sensor.back_right_smart_person:
        fluent: camera.back_right_fluent_lens_0
        name: Back Right
    # Cameras currently showing a person; fall back to doorbell if none read on.
    active_ids: "{{ expand('group.property_person') | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
    primary_id: "{{ (active_ids + ['binary_sensor.doorbell_smart_person'])[0] }}"
    camera_name: "{{ cam_map[primary_id].name }}"
    active_names: >-
      {% set ns = namespace(n=[]) %}
      {% for e in active_ids %}{% set ns.n = ns.n + [cam_map[e].name] %}{% endfor %}
      {{ ns.n | join(', ') if ns.n | count > 0 else camera_name }}
    event_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
    # One snapshot per active camera: list of {cam, file}. shots[0] is the primary.
    shots: >-
      {% set ns = namespace(s=[]) %}
      {% set ids = active_ids if active_ids | count > 0 else [primary_id] %}
      {% for e in ids %}{% set ns.s = ns.s + [{'cam': cam_map[e].fluent, 'file': '/media/llmvision/events/' ~ (cam_map[e].name | slugify) ~ '_' ~ event_ts ~ '.jpg'}] %}{% endfor %}
      {{ ns.s }}
    image_files: "{{ shots | map(attribute='file') | list }}"
    camera_entity: "{{ shots[0].cam }}"
    image_file: "{{ shots[0].file }}"
    notification_tag: security_alert
  action:
    # Snapshot every active camera to its own file.
    - repeat:
        for_each: "{{ shots }}"
        sequence:
          - action: camera.snapshot
            target:
              entity_id: "{{ repeat.item.cam }}"
            data:
              filename: "{{ repeat.item.file }}"
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: "Awareness: Person at {{ active_names }}"
        message: Person detected — analyzing...
        data:
          tag: "{{ notification_tag }}"
          image: "/api/camera_proxy/{{ camera_entity }}"
          channel: Camera Alerts
          importance: high
    - action: notify.email_alert
      data:
        title: "Awareness Alert: Person at {{ active_names }}"
        message: "A person was detected at {{ active_names }} while armed away."
        data:
          images: "{{ image_files }}"
    - action: llmvision.image_analyzer
      data:
        provider: 01KHDH36JH319D6FP251VYXE80
        # All active-camera snapshots (newline-separated; llmvision splits on \n).
        image_file: "{{ image_files | join('\n') }}"
        message: >-
          These are simultaneous snapshots from {{ image_files | count }} security
          camera(s) covering the property ({{ active_names }}). Describe what is
          happening across them in 2-3 sentences, focusing on any people or
          vehicles. Be concise and factual.
        store_in_timeline: false
        expose_images: true
      response_variable: llm_result
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: "Awareness: Person at {{ active_names }}"
        message: "{{ llm_result.response_text | default('Motion detected.') }}"
        data:
          tag: "{{ notification_tag }}"
          image: "{{ llm_result.get('image') or ('/api/camera_proxy/' ~ camera_entity) }}"
          channel: Camera Alerts
          importance: high
    # Cooldown: stay "running" so mode:single drops repeat detections for this long.
    - delay:
        minutes: "{{ states('input_number.security_alert_cooldown_minutes') | int(5) }}"

- id: '1780204797795'
  alias: Security - Stage 1 (Alert)
  description: >-
    Snapshot + Alexa announce + push + email when a person lingers anywhere on
    the property for the Stage-1 delay. Property-wide; snapshots every active
    camera; mode:single + a trailing delay enforces a cooldown.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: group.property_person
      to: 'on'
      for:
        seconds: "{{ states('input_number.security_stage_1_alert_seconds') | int(15) }}"
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state:
        - armed_away
        - armed_home
  variables:
    cam_map:
      binary_sensor.doorbell_smart_person:
        fluent: camera.doorbell_fluent
        name: Doorbell
      binary_sensor.front_left_smart_person:
        fluent: camera.front_left_fluent_lens_0
        name: Front Left
      binary_sensor.front_right_smart_person:
        fluent: camera.front_right_fluent_lens_0
        name: Front Right
      binary_sensor.back_left_smart_person:
        fluent: camera.living_room_fluent_lens_0
        name: Back Left
      binary_sensor.back_right_smart_person:
        fluent: camera.back_right_fluent_lens_0
        name: Back Right
    active_ids: "{{ expand('group.property_person') | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
    primary_id: "{{ (active_ids + ['binary_sensor.doorbell_smart_person'])[0] }}"
    camera_name: "{{ cam_map[primary_id].name }}"
    active_names: >-
      {% set ns = namespace(n=[]) %}
      {% for e in active_ids %}{% set ns.n = ns.n + [cam_map[e].name] %}{% endfor %}
      {{ ns.n | join(', ') if ns.n | count > 0 else camera_name }}
    linger_seconds: "{{ states('input_number.security_stage_1_alert_seconds') | int(15) }}"
    event_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
    shots: >-
      {% set ns = namespace(s=[]) %}
      {% set ids = active_ids if active_ids | count > 0 else [primary_id] %}
      {% for e in ids %}{% set ns.s = ns.s + [{'cam': cam_map[e].fluent, 'file': '/media/llmvision/events/' ~ (cam_map[e].name | slugify) ~ '_' ~ event_ts ~ '.jpg'}] %}{% endfor %}
      {{ ns.s }}
    image_files: "{{ shots | map(attribute='file') | list }}"
    camera_entity: "{{ shots[0].cam }}"
    image_file: "{{ shots[0].file }}"
    notification_tag: security_alert
  action:
    # Snapshot every active camera to its own file.
    - repeat:
        for_each: "{{ shots }}"
        sequence:
          - action: camera.snapshot
            target:
              entity_id: "{{ repeat.item.cam }}"
            data:
              filename: "{{ repeat.item.file }}"
    - action: script.announce
      data:
        message: "Alert: A person has been lingering at {{ active_names }} for {{ linger_seconds }} seconds."
        type: announce
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: Lingering Alert
        message: "A person is lingering at {{ active_names }}!"
        data:
          tag: "{{ notification_tag }}"
          image: "/api/camera_proxy/{{ camera_entity }}"
          channel: Camera Alerts
          importance: high
    - action: notify.email_alert
      data:
        title: "Alert: Lingering Person at {{ active_names }}"
        message: "A person has been lingering at {{ active_names }} for {{ linger_seconds }} seconds while the alarm is armed."
        data:
          images: "{{ image_files }}"
    # Cooldown: stay "running" so mode:single drops repeat detections for this long.
    - delay:
        minutes: "{{ states('input_number.security_alert_cooldown_minutes') | int(5) }}"

- id: '1780204799154'
  alias: Security - Stage 2 (Alarm Trigger)
  description: >-
    Turns ON the Master Siren Toggle when a person lingers anywhere on the
    property for the Stage-2 delay, or when Alarmo itself trips. The
    property-wide group keeps the linger timer continuous as the person moves
    between cameras (a per-camera timer would reset on every hand-off).
  mode: single
  trigger:
    - platform: state
      entity_id: group.property_person
      to: 'on'
      for:
        seconds: "{{ states('input_number.security_stage_2_alarm_seconds') | int(60) }}"
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: triggered
  condition:
    # 'triggered' must be allowed here: when the Alarmo-triggered trigger fires,
    # the panel state IS 'triggered', so without it the alarm path would be a no-op.
    # The camera-linger trigger still requires an armed state (away/home).
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state:
        - armed_away
        - armed_home
        - triggered
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.master_siren_toggle

- id: '1780204799287'
  alias: Security - Disarm Stops Sirens
  description: Instantly turns OFF the Master Siren Toggle when Alarmo is disarmed.
  mode: single
  trigger:
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: disarmed
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.master_siren_toggle

- id: '1780204799999'
  alias: Security - Siren Response ON
  description: Fires all sirens and notifications when the Master Siren Toggle is turned on.
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.master_siren_toggle
      to: 'on'
  action:
    - if:
        - condition: state
          entity_id: input_boolean.sirens_enabled
          state: 'on'
      then:
        - action: siren.turn_on
          target:
            entity_id:
              - siren.doorbell_siren
              - siren.front_left_siren
              - siren.front_right_siren
              - siren.living_room_siren
              - siren.back_right_siren
    - action: script.announce
      data:
        message: Warning! Intruder detected! Authorities have been notified!
        type: announce
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: CRITICAL ALARM!
        message: SIRENS ACTIVATED!
        data:
          channel: Camera Alerts
          importance: high
    - action: notify.email_alert
      data:
        title: CRITICAL ALARM TRIGGERED!
        message: Sirens have been activated. Immediate attention required.

- id: '1780204800000'
  alias: Security - Siren Response OFF
  description: Stops all sirens when the Master Siren Toggle is turned off.
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.master_siren_toggle
      to: 'off'
  action:
    - action: siren.turn_off
      target:
        entity_id:
          - siren.doorbell_siren
          - siren.front_left_siren
          - siren.front_right_siren
          - siren.living_room_siren
          - siren.back_right_siren

- id: '1780204799409'
  alias: Auto Disarm When Phone Arrives
  description: Disarms the alarm automatically when the Pixel 8 Pro arrives home.
  mode: single
  trigger:
    - platform: state
      entity_id: person.cherpin
      to: home
  condition:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
  action:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.alarmo
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: Alarm Disarmed
        message: Welcome home. The alarm has been automatically disarmed.

- id: '1780204799500'
  alias: Auto Arm Home at Night
  description: Automatically secures the perimeter at night, or 15 minutes after late arrivals/disarming.
  mode: single
  trigger:
    - platform: time
      at: "22:00:00"
    - platform: state
      entity_id: alarm_control_panel.alarmo
      to: disarmed
      for:
        minutes: 15
  condition:
    - condition: time
      after: "21:59:59"
      before: "06:00:00"
    - condition: state
      entity_id: person.cherpin
      state: home
  action:
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.alarmo
    - action: notify.mobile_app_pixel_8_pro
      data:
        title: House Armed for the Night
        message: The perimeter has been automatically secured (Armed Home).
