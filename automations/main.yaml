- id: '1770741442985'
  alias: Auto-enable Person Recognition on Startup
  description: Ensures person recognition is enabled after Home Assistant restarts
  triggers:
    - platform: homeassistant
      event: start
  conditions: []
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.person_recognition_enabled
  mode: single

- id: '1770741442986'
  alias: Notify when front door is unlocked - edited through git
  description: ''
  triggers:
    - entity_id: lock.assure_2_biometric_deadbolt
      from: locked
      to: unlocked
      trigger: state
  conditions: []
  actions:
    # Was notify.notify, which fans out to EVERY notify platform — the retired
    # Pixel 8 Pro, both live phones, every Echo in the house, and SMTP.
    - action: script.notify
      data:
        audience: house_admins
        severity: info
        category: doors
        tag_suffix: unlock
        title: Door Unlocked
        message: "\U0001F6AA Front door was unlocked"
  mode: single
