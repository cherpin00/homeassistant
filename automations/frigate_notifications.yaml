# Frigate camera notifications — SgtBatten blueprint (v0.14.0.2y).
#
# Design notes that are easy to get wrong later:
#
#   * THIS IS THE ONE NOTIFICATION PATH THAT BYPASSES script.notify, and that
#     is deliberate. The blueprint calls notify.<service> directly in ~10
#     places with its own rich payload, and script.notify is a script, not a
#     notify service — the blueprint's `notify_group` input cannot target it.
#     The alternatives were forking 2147 lines of upstream YAML forever, or
#     hand-rebuilding the blueprint against script.notify and losing the
#     live-updating thumbnail. Both cost more than the inconsistency does.
#     To revisit: either upstream grows a "call a script" target, or replace
#     this file with a custom frigate/reviews MQTT automation that calls
#     script.notify with push_data carrying the image and actions.
#
#   * Because it bypasses the router, this reaches ONE device. Adding Becca
#     means creating a notify group and pointing `notify_group` at it — the
#     roster in notify_roster.yaml does not apply here.
#
#   * IT NOTIFIES REGARDLESS OF ALARM STATE, on purpose. This first shipped
#     gated on Alarmo being `disarmed`, on the theory that alarm_system.yaml's
#     Stage 0/1/2 already cover the armed case. The state history said
#     otherwise: Alarmo sits at `armed_home` essentially permanently (one
#     state change in seven days, and auto_disarm_when_phone_arrives had not
#     fired in over a week), so the gated version was silent in practice.
#     Accepted trade-off: during a genuine armed_away event you will get this
#     push AND Stage 0's AI push for the same person. If that gets annoying,
#     re-add `state_filter: true` with `armed_home` and `disarmed` in
#     `state_filter_states` rather than going back to `disarmed` alone.
#
#   * review_severity is alerts ONLY. The blueprint defaults to alerts AND
#     detections, which across five cameras is a firehose.
#
#   * base_url is REQUIRED, not optional, because the target is Android —
#     without it the notification arrives with no thumbnail.
#
#   * Requires the Frigate integration's "unauthenticated notification event
#     proxy" to stay enabled, or thumbnails and clips 401. It is not set
#     explicitly in the config entry options; it defaults to True in
#     custom_components/frigate/views.py.

- id: frigate_notifications
  alias: Frigate - Camera Notifications
  description: >-
    Everyday camera awareness while the alarm is disarmed. Sends an actionable
    push per Frigate alert with a thumbnail that updates as Frigate gets a
    better frame. Goes silent whenever Alarmo is armed, leaving the armed path
    to the Stage 0/1/2 tiers in alarm_system.yaml.
  use_blueprint:
    path: SgtBatten/frigate_notifications.yaml
    input:
      camera:
        - camera.doorbell
        - camera.front_left
        - camera.front_right
        - camera.back_left
        - camera.back_right
      # notify_device must be a REAL device id even though notify_group
      # overrides it at runtime. The blueprint has `device_id: !input
      # notify_device` in the no-group branch, and HA validates the whole
      # automation at load time -- including that dead branch. Left at its
      # `false` default it fails with "Unknown device 'False'" and the
      # automation loads as `unavailable`. `ha core check` does NOT catch
      # this; only an automation reload surfaces it.
      # Delivery still goes through notify_group, so the live path uses the
      # stable service name rather than this opaque id.
      notify_device: 4049cd9f5f5d3175cd23764aa82e5b4c  # Pixel 10
      notify_group: mobile_app_pixel_10
      base_url: https://ha.stone.herpin.xyz
      review_severity:
        - alert
      cooldown: 120
      # Person only. Measured over 24h: 103 alerts, of which 93 were cars and
      # 10 were people -- 85 on front_left alone, which watches the road. Zone
      # filtering does NOT help: 83 of the car alerts were inside
      # front_left_property, so the cars are genuinely on the property. And a
      # zone filter would actively hurt, because back_left/back_right person
      # events carry no zones at all (templates.yaml uses whole-frame
      # back_*_person_occupancy for those, not *_property_person_occupancy).
      # Object filtering is the only discriminator that works here.
      labels:
        - person
      # Button 2 replaces the blueprint's "View Snapshot" default -- the
      # notification already embeds the snapshot, so a button for it is dead
      # weight. This is the blueprint's own "View Stream" preset: HA's MJPEG
      # proxy for whichever camera triggered.
      #
      # KNOWN LIMIT: the access_token is baked in when the notification is sent
      # and HA rotates it every few minutes, so tapping a notification more than
      # ~5 min old returns 403. Verified: fresh token 200, 20-minute-old token
      # 403. That is acceptable because this button is for acting in the moment;
      # the durable alternative is a Lovelace view reached by a RELATIVE path
      # (opens in-app, in-session, never expires).
      #
      # Do NOT use the blueprint's "Open Frigate" presets
      # (/ccab4aaf_frigate/dashboard) -- those are for the Frigate ADD-ON, and
      # this Frigate is a separate VM, so they 404 here.
      button_2: View Live
      url_2: "{{base_url}}/api/camera_proxy_stream/camera.{{trigger.payload_json['after']['camera'] | lower | replace('-','_')}}?token={{state_attr( 'camera.' ~ camera, 'access_token')}}"
