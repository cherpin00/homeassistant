# Garage automation subsystem — ratgdo32 disco (device suffix f9898c).
#
# Design notes that are easy to get wrong later:
#
#   * The Disco's time-of-flight laser points DOWN AT THE BAY, not out the
#     driveway. `_vehicle_leaving` therefore means "the car left the bay" (a
#     great auto-close trigger) while `_vehicle_arriving` means "the car is
#     already inside" and is useless for auto-open. Auto-open has to come from
#     the car's GPS instead.
#
#   * Auto-open keys off the Model Y, not a phone, so it only fires when the
#     car is what is arriving. sensor.home_location_distance is the Model Y's
#     distance from the `proximity` config entry ("Home"); the ambiguous id is
#     what HA generated from the tracker name "Location". It reports FEET on
#     this instance, not meters.
#
#   * The Tesla Fleet integration only polls every 10 MINUTES. Across ten
#     arrivals in Oct 2026 the car was never once seen inside the approach
#     radius before it was already parked — so on its own it is useless here.
#     garage_tesla_approach_poll fixes that by forcing refreshes, timed off the
#     navigation ETA. That means auto-open needs NAVIGATION SET TO HOME; without
#     a route there is nothing to schedule polls from and the door stays shut.
#
#   * Every guard here is advisory. The real last line of defence is the
#     opener's own photo-eye beam, surfaced as `_obstruction`, which
#     script.garage_close_safely checks before moving the door.

- id: garage_tesla_approach_poll
  alias: Garage - Poll Model Y When Nearly Home
  description: >-
    While the Model Y is navigating home, sleeps until the ETA is a few minutes
    out, then force-refreshes the car's location every few seconds so the
    auto-open below sees it cross the approach distance in time.
  # single, not restart: each forced refresh also updates the ETA sensor, which
  # would otherwise restart this run and reset the iteration cap below.
  mode: single
  max_exceeded: silent
  variables:
    # Start fast polling this many seconds before the ETA. Tesla's ETA is only
    # minute-accurate, so leave slack.
    fast_window_s: 180
    # Fast poll interval. At 30 mph the car covers ~440 ft between polls, which
    # has to fit inside the approach distance with room for the 10 s door open.
    fast_interval_s: 10
    # Longest sleep in the slow phase, so a changed ETA (traffic) is re-read.
    max_sleep_s: 300
    # Hard stop. Each poll is a billed Fleet API vehicle_data call.
    max_polls: 120
  triggers:
    - alias: A route home appeared
      trigger: state
      entity_id: device_tracker.caleb_s_model_y_route
      to: home
    - alias: ETA refreshed
      trigger: state
      entity_id: sensor.caleb_s_model_y_time_to_arrival
  conditions:
    - condition: state
      entity_id: input_boolean.garage_auto_open_enabled
      state: "on"
    # Polls cost money; don't pay for them if the consumer is switched off.
    - condition: state
      entity_id: automation.garage_auto_open_on_approach
      state: "on"
    - condition: state
      entity_id: device_tracker.caleb_s_model_y_route
      state: home
    # Navigation gets set from the driveway too — see climate.yaml.
    - condition: not
      conditions:
        - condition: state
          entity_id: device_tracker.caleb_s_model_y_location
          state: home
    - condition: state
      entity_id: cover.ratgdo32disco_f9898c_door
      state: closed
  actions:
    - repeat:
        while:
          - condition: state
            entity_id: device_tracker.caleb_s_model_y_route
            state: home
          - condition: not
            conditions:
              - condition: state
                entity_id: device_tracker.caleb_s_model_y_location
                state: home
          - condition: state
            entity_id: cover.ratgdo32disco_f9898c_door
            state: closed
          # Inside the radius means auto-open has had its chance; stop paying.
          - condition: numeric_state
            entity_id: sensor.home_location_distance
            above: input_number.garage_approach_distance_ft
          - condition: template
            value_template: "{{ repeat.index <= max_polls }}"
        sequence:
          # The ETA is an absolute timestamp, not a countdown, hence the
          # template. An unavailable or past ETA reads as 0 = poll fast.
          - variables:
              secs_out: >-
                {% set eta = 'sensor.caleb_s_model_y_time_to_arrival' %}
                {{ ((as_datetime(states(eta)) - now()).total_seconds()) | int
                   if has_value(eta) else 0 }}
          - alias: Sleep until nearly home, then at the fast interval
            delay:
              seconds: >-
                {{ [[secs_out - fast_window_s, fast_interval_s] | max,
                    max_sleep_s] | min }}
          - alias: Force a Fleet API refresh of the car
            action: homeassistant.update_entity
            target:
              entity_id: device_tracker.caleb_s_model_y_location
            # One failed API call should not end polling for the whole trip.
            continue_on_error: true

- id: garage_auto_open_on_approach
  alias: Garage - Auto Open on Approach
  description: >-
    Opens the garage when the Model Y closes to within the approach distance.
  mode: single
  triggers:
    # A downward crossing already implies the car is inbound, so there is no
    # separate direction-of-travel check.
    - trigger: numeric_state
      entity_id: sensor.home_location_distance
      below: input_number.garage_approach_distance_ft
  conditions:
    - condition: state
      entity_id: input_boolean.garage_auto_open_enabled
      state: "on"
    - condition: state
      entity_id: cover.ratgdo32disco_f9898c_door
      state: closed
    # Belt and braces against a stale reading: the car cannot be arriving if
    # the bay laser already sees it.
    - condition: state
      entity_id: binary_sensor.ratgdo32disco_f9898c_vehicle_detected
      state: "off"
    # A 10-minute poll that first sees the car inside the home zone means it
    # has been parked on the driveway for a while. Opening then would open the
    # door behind someone who has already gone inside.
    - condition: not
      conditions:
        - condition: state
          entity_id: device_tracker.caleb_s_model_y_location
          state: home
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.ratgdo32disco_f9898c_door
    - action: script.notify
      data:
        audience: caleb
        severity: info
        category: garage
        tag_suffix: auto_open
        title: Garage Opening
        message: Welcome home — opening the garage.
    # Hold the run open so mode:single drops re-triggers for the cooldown
    # window. Same trick as security_alert_cooldown_minutes in alarm_system.yaml.
    - alias: Cooldown — absorb GPS flapping around the threshold
      delay:
        minutes: "{{ states('input_number.garage_auto_open_cooldown_minutes') | int(10) }}"

- id: garage_auto_close_on_departure
  alias: Garage - Auto Close on Departure
  description: >-
    Closes the garage after the Model Y pulls out of the bay, once the car has
    had time to clear the apron.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.ratgdo32disco_f9898c_vehicle_leaving
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.garage_auto_close_enabled
      state: "on"
    - condition: not
      conditions:
        - condition: state
          entity_id: cover.ratgdo32disco_f9898c_door
          state: closed
  actions:
    - alias: Let the car clear the apron
      delay:
        seconds: "{{ states('input_number.garage_auto_close_delay_seconds') | int(25) }}"
    - alias: Abort if anything changed during the clearance delay
      condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.ratgdo32disco_f9898c_obstruction
          state: "off"
        # Car pulled back in — leave the door alone.
        - condition: state
          entity_id: binary_sensor.ratgdo32disco_f9898c_vehicle_detected
          state: "off"
        - condition: not
          conditions:
            - condition: state
              entity_id: cover.ratgdo32disco_f9898c_door
              state: closed
    - action: script.garage_close_safely
      data:
        reason: auto-close after departure
    # The script owns obstruction-abort and close-failure notifications, so
    # only claim success if the door genuinely reached closed.
    - if:
        - condition: state
          entity_id: cover.ratgdo32disco_f9898c_door
          state: closed
      then:
        - action: script.notify
          data:
            audience: caleb
            severity: info
            category: garage
            tag_suffix: auto_close
            title: Garage Closed
            message: Closed the garage behind you.

- id: garage_left_open_alert
  alias: Garage - Left Open Alert
  description: >-
    Once the door has been open past the threshold, notify with Close Now /
    Snooze buttons and keep reminding until it is shut.
  mode: restart
  triggers:
    - trigger: state
      entity_id: cover.ratgdo32disco_f9898c_door
      to: open
  conditions: []
  actions:
    - alias: Grace period before the first alert
      delay:
        minutes: "{{ states('input_number.garage_open_alert_minutes') | int(15) }}"
    - repeat:
        while:
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.ratgdo32disco_f9898c_door
                state: closed
        sequence:
          - action: script.notify
            data:
              audience: house_admins
              severity: warn
              category: garage
              tag_suffix: open
              title: Garage Still Open
              message: >-
                Open for {{ relative_time(states.cover.ratgdo32disco_f9898c_door.last_changed) }}.
              push_data:
                actions:
                  - action: GARAGE_CLOSE
                    title: Close Now
                  - action: GARAGE_SNOOZE
                    title: Snooze 30m
          - alias: Wait for a snooze tap, or time out and remind again
            wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: GARAGE_SNOOZE
            timeout:
              minutes: "{{ states('input_number.garage_reminder_interval_minutes') | int(15) }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              # Fixed at 30 minutes on purpose, so it cannot drift out of sync
              # with the "Snooze 30m" button label.
              - alias: Snoozed
                delay:
                  minutes: 30
    # Must target the same audience as the alert above, or the notification
    # stays stuck on whichever phone is not cleared.
    - alias: Door is shut — clear any lingering alert from the phones
      action: script.notify
      data:
        audience: house_admins
        category: garage
        tag_suffix: open
        message: clear_notification

- id: garage_night_force_close
  alias: Garage - Night Force Close
  description: >-
    Backstop for the door being left open overnight or after the house is armed
    away. Warns with a Cancel button first, then closes.
  mode: single
  triggers:
    - trigger: time_pattern
      hours: "/1"
      minutes: 0
      seconds: 0
      id: hourly
    - trigger: state
      entity_id: alarm_control_panel.alarmo
      to: armed_away
      id: armed_away
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: cover.ratgdo32disco_f9898c_door
          state: closed
    # The hourly tick only counts at the configured night hour. Arming away
    # counts at any hour.
    - condition: or
      conditions:
        - condition: trigger
          id: armed_away
        - condition: template
          value_template: >-
            {{ now().hour == states('input_number.garage_night_close_hour') | int(23) }}
  actions:
    - action: script.notify
      data:
        audience: house_admins
        severity: warn
        category: garage
        tag_suffix: night_close
        title: Garage Still Open
        message: Closing the garage in 2 minutes. Tap Cancel to leave it open.
        push_data:
          actions:
            - action: GARAGE_CANCEL_CLOSE
              title: Cancel
    - wait_for_trigger:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: GARAGE_CANCEL_CLOSE
      timeout: "00:02:00"
      continue_on_timeout: true
    - if:
        - condition: template
          value_template: "{{ wait.completed }}"
      then:
        # Same audience and tag as the warning, so this replaces it in place
        # on every phone that got it.
        - action: script.notify
          data:
            audience: house_admins
            severity: info
            category: garage
            tag_suffix: night_close
            title: Garage Night Close Cancelled
            message: Leaving the garage open.
        - stop: Cancelled from the notification
    - action: script.garage_close_safely
      data:
        reason: night force-close

- id: garage_notification_close_action
  alias: Garage - Close From Notification
  description: >-
    Handles the Close Now button. Kept separate from the alert loop so the
    button still works after that automation has exited or been restarted.
  mode: single
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: GARAGE_CLOSE
  conditions: []
  actions:
    - action: script.garage_close_safely
      data:
        reason: closed from notification
