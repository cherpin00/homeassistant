master_siren_toggle:
  name: Master Siren Toggle
  icon: mdi:bullhorn

sirens_enabled:
  name: Hardware Sirens Enabled
  icon: mdi:volume-high

prefer_frigate_sensors:
  name: Prefer Frigate Sensors (Smart Fallback)
  icon: mdi:cctv
  initial: true

# ── Garage ──────────────────────────────────────────────────────────────────
# Kill switches. Deliberately no `initial:` so a restart restores whatever you
# last set, rather than silently re-enabling an automation you turned off.
garage_auto_open_enabled:
  name: Garage Auto Open Enabled
  icon: mdi:garage-open-variant

garage_auto_close_enabled:
  name: Garage Auto Close Enabled
  icon: mdi:garage-variant

# ── Tesla ───────────────────────────────────────────────────────────────────
# Kill switch for the calendar-driven preconditioner (pyscript app
# tesla_precondition). Turn it off to stop the car being woken and cooled for
# calendar events -- e.g. when it is unplugged and you would rather keep the
# charge. Does not affect the manual "Schedule Precondition" controls.
# No `initial:` for the same reason as the garage switches above.
tesla_precondition_enabled:
  name: Tesla Calendar Preconditioning
  icon: mdi:car-clock
