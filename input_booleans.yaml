master_siren_toggle:
  name: Master Siren Toggle
  icon: mdi:bullhorn

sirens_enabled:
  name: Hardware Sirens Enabled
  icon: mdi:volume-high

prefer_frigate_sensors:
  name: Prefer Frigate Sensors (Smart Fallback)
  icon: mdi:cctv
