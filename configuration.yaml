# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

group: !include groups.yaml
input_number: !include input_numbers.yaml
input_boolean: !include input_booleans.yaml
template: !include templates.yaml

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.72.0/24
    - 192.168.98.0/24
    # Tailscale CGNAT range. The Prometheus tailscale sidecar gets a
    # NEW tailnet IP on every pod restart (currently on its 22nd),
    # so this must be the range, not a pinned address.
    - 100.64.0.0/10

homeassistant:
  external_url: https://ha.stone.herpin.xyz
  internal_url: http://192.168.98.99:8123

prometheus:

notify:
  - name: email_alert
    platform: smtp
    server: smtp.gmail.com
    port: 587
    timeout: 15
    sender: herpintech@gmail.com
    encryption: starttls
    username: herpintech@gmail.com
    password: !secret gmail_password
    recipient:
      - caleb.herpin@gmail.com
      - beccacb3@gmail.com
    sender_name: Home Security

pyscript:
  allow_all_imports: true
  hass_is_global: true

  apps:
    tesla_precondition:
      calendar_entities: [calendar.caleb_herpin_gmail_com]
      climate_entity: climate.caleb_s_model_y_climate
      car_tracker: device_tracker.caleb_s_model_y_location
      phone_tracker: person.cherpin
      soc_sensor: sensor.caleb_s_model_y_battery_level
      cabin_temp_sensor: sensor.caleb_s_model_y_inside_temperature
      outside_temp_sensor: sensor.caleb_s_model_y_outside_temperature
      notify_target: mobile_app_pixel_10
      travel_provider: waze
      dry_run: false
      precondition_lead_min: 5   # cabin reaches the comfort band in <10 min, even from 109F
      battery_floor_pct: 20
      comfort_low_f: 60
      comfort_high_f: 75
      colocation_radius_m: 150
      gps_staleness_max_min: 30
      lookahead_hours: 12
      loop_interval_min: 2
      unanswered_ask_default: skip
    precondition_manual:
      climate_entity: climate.caleb_s_model_y_climate
      notify_target: mobile_app_pixel_10
      max_retries: 3
      retry_delay_sec: 15
counter: !include pyscript/counters.yaml

rest_command:
  tasker:
    url: 'http://{{ip_address}}:{{port}}/{{path}}'
    method: POST
    verify_ssl: false
    payload: "{{ event }}"
    content_type: 'application/json; charset=utf-8'

lovelace:
  mode: storage
  dashboards:
    tesla-car:
      mode: yaml
      filename: dashboards/tesla.yaml
      title: Tesla
      icon: mdi:car
      show_in_sidebar: true
      require_admin: false
