test_person_registry_read:
  alias: Test Person Registry Read
  sequence:
  - variables:
      registry_raw: '{{ states(''input_text.person_registry_metadata'') }}'
      registry_json: '{{ registry_raw | from_json }}'
      next_id: '{{ registry_json.next_id }}'
      person_ids: '{{ registry_json.person_ids }}'
  - action: persistent_notification.create
    data:
      title: Person Registry Test
      message: 'Registry loaded successfully!


        Next ID: {{ next_id }}

        Person IDs: {{ person_ids | join('', '') }}

        Last Updated: {{ registry_json.last_updated }}'
test_person_data_readwrite:
  alias: Test Person Data Read/Write
  sequence:
  - variables:
      person_a_raw: '{{ states(''input_text.person_a_data'') }}'
      person_a_json: '{{ person_a_raw | from_json }}'
  - variables:
      updated_person_a: '{{ person_a_json | combine({''appearance_count'': person_a_json.appearance_count
        + 1, ''last_seen'': now().isoformat()}) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.person_a_data
    data:
      value: '{{ updated_person_a | to_json }}'
  - delay:
      seconds: 1
  - variables:
      person_a_verify: '{{ states(''input_text.person_a_data'') | from_json }}'
  - action: persistent_notification.create
    data:
      title: Person Data Test
      message: 'Person A data update successful!


        ID: {{ person_a_verify.id }}

        Label: {{ person_a_verify.label }}

        Appearance Count: {{ person_a_verify.appearance_count }}

        Last Seen: {{ person_a_verify.last_seen }}'
announce:
  alias: Alexa Announce
  mode: queued
  fields:
    message:
      name: Message
      required: true
      selector:
        text:
    type:
      name: Type
      required: false
      default: announce
      selector:
        select:
          options:
          - announce
          - tts
  sequence:
  - action: notify.alexa_media_caleb_s_3rd_echo_dot
    data:
      message: '{{ message }}'
      data:
        type: '{{ type | default(''announce'') }}'

precondition_car_delayed:
  alias: Precondition Car (Delayed)
  mode: parallel
  fields:
    delay_minutes:
      name: Delay Minutes
      description: Minutes to wait before preconditioning
      required: true
      selector:
        number:
          min: 1
          max: 480
  sequence:
    - delay:
        minutes: '{{ delay_minutes | int }}'
    - variables:
        attempt: 0
        precond_success: false
        precond_error: Unknown error
    - repeat:
        while:
          - condition: template
            value_template: '{{ not precond_success and attempt < 3 }}'
        sequence:
          - variables:
              attempt: '{{ attempt + 1 }}'
          - action: climate.turn_on
            continue_on_error: true
            target:
              entity_id: climate.caleb_s_model_y_climate
          - if:
              - condition: template
                value_template: '{{ last_error is not defined }}'
            then:
              - variables:
                  precond_success: true
            else:
              - variables:
                  precond_error: '{{ last_error }}'
              - if:
                  - condition: template
                    value_template: '{{ attempt < 3 }}'
                then:
                  - delay:
                      seconds: 15
    - if:
        - condition: template
          value_template: '{{ precond_success }}'
      then:
        - action: notify.mobile_app_pixel_8_pro
          data:
            title: Car is preconditioning
            message: 'Climate turned on (attempt {{ attempt }} of 3)'
      else:
        - action: notify.mobile_app_pixel_8_pro
          data:
            title: Precondition failed
            message: 'Failed after 3 attempts: {{ precond_error }}'
