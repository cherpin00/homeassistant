# First-pass shared helpers for auto-off delays

default_light_auto_off_minutes:
  name: Default Light Auto Off Minutes
  min: 1
  max: 120
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 15

bathroom_light_auto_off_minutes:
  name: Bathroom Light Auto Off Minutes
  min: 1
  max: 120
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 20

bathroom_fan_auto_off_minutes:
  name: Bathroom Fan Auto Off Minutes
  min: 1
  max: 180
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 30

security_sensor_debounce_seconds:
  name: Security Sensor Debounce (Seconds)
  min: 1
  max: 60
  step: 1
  mode: box
  unit_of_measurement: s
  initial: 10

security_stage_1_alert_seconds:
  name: Security Stage 1 Alert Delay (Seconds)
  min: 5
  max: 300
  step: 5
  mode: box
  unit_of_measurement: s
  initial: 15

security_stage_2_alarm_seconds:
  name: Security Stage 2 Alarm Delay (Seconds)
  min: 15
  max: 600
  step: 15
  mode: box
  unit_of_measurement: s
  initial: 60

# After an alert fires, suppress further alerts of the same stage for this long.
# Implemented via mode:single + a trailing delay, so the automation stays "running"
# (and drops new triggers) for the cooldown window. Set to 0 to disable cooldown.
security_alert_cooldown_minutes:
  name: Security Alert Cooldown (Minutes)
  min: 0
  max: 60
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 5

# How many seconds before a stage deadline to submit footage to the LLM.
# Set high enough that the LLM response reliably returns before the stage fires.
# Increase if you see "analysis unavailable" in notifications.
security_llm_lead_time_seconds:
  name: Security LLM Lead Time (Seconds)
  min: 3
  max: 30
  step: 1
  mode: box
  unit_of_measurement: s
  initial: 8

# How often (in seconds) to snapshot the primary camera during frame collection.
# Lower = more frames and better LLM context; higher = fewer API frames sent.
security_frame_interval_seconds:
  name: Security Frame Interval (Seconds)
  min: 5
  max: 60
  step: 5
  mode: box
  unit_of_measurement: s
  initial: 10

# Delay used by script.precond_schedule_from_ui when calling
# pyscript.precondition_manual_schedule.
precond_delay_minutes:
  name: Precondition Delay
  min: 1
  max: 480
  step: 5
  unit_of_measurement: min
  icon: mdi:timer
  mode: box

# ── Garage ──────────────────────────────────────────────────────────────────
# Seconds to wait after the Model Y clears the bay before closing, so the car
# is off the apron. Re-checked against the safety beam after the delay.
garage_auto_close_delay_seconds:
  name: Garage Auto Close Delay (Seconds)
  min: 5
  max: 120
  step: 5
  mode: box
  unit_of_measurement: s
  initial: 25

# How long the door may stand open before the first "left open" alert.
garage_open_alert_minutes:
  name: Garage Left Open Alert (Minutes)
  min: 1
  max: 120
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 15

# Gap between repeat reminders while the door stays open.
garage_reminder_interval_minutes:
  name: Garage Reminder Interval (Minutes)
  min: 5
  max: 120
  step: 5
  mode: box
  unit_of_measurement: min
  initial: 15

# After an auto-open, ignore further approach triggers for this long. This is
# what absorbs GPS flapping around the threshold.
garage_auto_open_cooldown_minutes:
  name: Garage Auto Open Cooldown (Minutes)
  min: 1
  max: 60
  step: 1
  mode: box
  unit_of_measurement: min
  initial: 10

# Approach radius for auto-open, compared against sensor.home_pixel_10_distance.
# FEET, not meters - the proximity sensor reports imperial on this instance.
# 1150 ft is ~350 m, roughly 26 s of warning at 30 mph against a 10.3 s open.
# Tunable from the UI; the numeric_state trigger reads this entity directly.
garage_approach_distance_ft:
  name: Garage Approach Distance (Feet)
  min: 300
  max: 5000
  step: 50
  mode: box
  unit_of_measurement: ft
  initial: 1150

# Departure radius for auto-close, compared against sensor.home_pixel_10_distance.
# FEET, same imperial sensor as the approach radius above. Kept well below the
# 1150 ft approach radius so a normal drive out closes the door quickly, and so
# GPS jitter near one threshold can never straddle the other.
garage_departure_distance_ft:
  name: Garage Departure Distance (Feet)
  min: 200
  max: 5000
  step: 50
  mode: box
  unit_of_measurement: ft
  initial: 750

# Hour of day (0-23) at which an still-open garage gets force-closed.
garage_night_close_hour:
  name: Garage Night Force Close Hour
  min: 0
  max: 23
  step: 1
  mode: box
  unit_of_measurement: h
  initial: 23
