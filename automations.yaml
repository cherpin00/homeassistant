- id: '1776816463721'
  alias: Secure House When Phone Leaves
  description: On departure, locks the deadbolt first and waits for it to confirm,
    then arms away once Caleb and Becca are both away. The 1-minute debounce
    filters GPS drift at the zone boundary. Locking still happens when Becca is
    home or the alarm is already armed; a jammed lock warns but never blocks arming.
  triggers:
  - trigger: state
    entity_id:
    - person.cherpin
    - person.becca
    to: not_home
    for:
      minutes: 1
  conditions:
  - condition: state
    entity_id: person.cherpin
    state: not_home
  actions:
  - alias: Lock the deadbolt and confirm before arming
    if:
    - condition: state
      entity_id: lock.assure_2_biometric_deadbolt
      state: unlocked
    then:
    - action: lock.lock
      target:
        entity_id: lock.assure_2_biometric_deadbolt
    - wait_for_trigger:
      - trigger: state
        entity_id: lock.assure_2_biometric_deadbolt
        to: locked
      timeout: 00:00:30
      continue_on_timeout: true
    - alias: Warn if the bolt never confirmed, but keep going
      if:
      - condition: not
        conditions:
        - condition: state
          entity_id: lock.assure_2_biometric_deadbolt
          state: locked
      then:
      - action: script.notify
        data:
          audience: house_admins
          severity: warn
          category: doors
          tag_suffix: lock
          title: Front Door Did Not Lock
          message: The deadbolt did not confirm locked. Arming anyway.
      else:
      - action: script.notify
        data:
          audience: house_admins
          severity: info
          category: doors
          tag_suffix: lock
          title: Front Door Locked
          message: The front door has been automatically locked.
  - alias: Arm away once everyone has left, unless already away or going off
    if:
    - condition: state
      entity_id:
      - person.cherpin
      - person.becca
      state: not_home
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.uno864_partition_1
        state:
        - armed_away
        - arming
        - pending
        - triggered
    then:
    - alias: Go through disarmed so a Stay arm can become Away
      if:
      - condition: state
        entity_id: alarm_control_panel.uno864_partition_1
        state:
        - armed_home
        - armed_night
      then:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.uno864_partition_1
      - wait_for_trigger:
        - trigger: state
          entity_id: alarm_control_panel.uno864_partition_1
          to: disarmed
        timeout: 00:00:30
        continue_on_timeout: true
    - alias: Arm only if the panel is ready, and wait out the exit delay
      if:
      - condition: state
        entity_id: binary_sensor.uno864_partition_1_ready
        state: 'on'
      then:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.uno864_partition_1
      - wait_for_trigger:
        - trigger: state
          entity_id: alarm_control_panel.uno864_partition_1
          to: armed_away
        timeout: 00:05:00
        continue_on_timeout: true
    - if:
      - condition: state
        entity_id: alarm_control_panel.uno864_partition_1
        state: armed_away
      then:
      - action: script.notify
        data:
          audience: house_admins
          severity: info
          category: security
          tag_suffix: arm_state
          title: House Secured
          message: The alarm has been automatically set to Armed Away.
      else:
      - action: script.notify
        data:
          audience: house_admins
          severity: warn
          category: security
          tag_suffix: arm_state
          title: Alarm Did Not Arm
          message: Everyone has left but the alarm did not arm. Check the front door.
  mode: single
- id: '1778390547200'
  alias: Auto Lock Front Door When Armed
  description: Locks the front door deadbolt whenever the alarm arms in any mode,
    if it isn't already locked. Covers arming paths other than departure, such as
    the 22:00 armed_home automation and manual arming.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.uno864_partition_1
    not_from:
    - unavailable
    - unknown
    to:
    - armed_away
    - armed_home
  conditions:
  - condition: state
    entity_id: lock.assure_2_biometric_deadbolt
    state: unlocked
  actions:
  - action: lock.lock
    target:
      entity_id: lock.assure_2_biometric_deadbolt
  - action: script.notify
    data:
      audience: house_admins
      severity: info
      category: doors
      tag_suffix: lock
      title: Front Door Locked
      message: The front door has been automatically locked.
  mode: queued
  max: 5
- id: morning_ac_cool_67
  alias: 'Morning AC: cool to 67 at 6:45'
  description: Turns the ecobee to cool at 67°F every morning at 6:45.
  triggers:
  - trigger: time
    at: 06:45:00
  conditions: []
  actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.ecobee_9505_stonebridge
    data:
      hvac_mode: cool
      temperature: 67
  mode: single
