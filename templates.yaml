- binary_sensor:
    - name: "Doorbell Smart Person"
      unique_id: doorbell_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% if states('binary_sensor.doorbell_property_person_occupancy') not in ['unavailable', 'unknown'] %}
          {{ states('binary_sensor.doorbell_property_person_occupancy') }}
        {% else %}
          {{ states('binary_sensor.doorbell_person') }}
        {% endif %}

