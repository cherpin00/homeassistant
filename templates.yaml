- binary_sensor:
# Smart person sensors. Each ANDs two Frigate signals:
#
#   <cam>_*person_occupancy  live zone tracking -- flips for objects Frigate is
#                            merely TRACKING, including ones it later discards
#                            as false positives, which leave NO event, NO clip
#                            and NO row in frigate.db.
#   <cam>_review_status      Frigate's REVIEW layer -- only ALERT once Frigate
#                            has committed to the detection.
#
# Occupancy alone caused a false siren on 2026-09-12: two ~6s phantom person
# flips on front_left, bridged by the 10s delay_off debounce into what looked
# like one continuous person, cleared Stage 2 at 52s (60s minus the 8s LLM lead)
# and latched input_boolean.master_siren_toggle. Frigate's own database had no
# object at all in that window, which is why nothing showed up in its UI.
#
# Backtested over 24h: occupancy alone gave 23 ON periods and one Stage 2;
# the AND gave 15, max 50s, ZERO reaching Stage 2, while both genuine person
# events still produced 47s and 50s spans (enough for Stage 0 and Stage 1).
#
# Degradation is deliberate and ordered:
#   Frigate entities unavailable  -> fall back to the camera's own Reolink sensor
#   review_status alone unavailable -> fall back to occupancy (today's behaviour)
# Known gap: if Frigate is degraded but still CONNECTED (e.g. ffmpeg restart
# loops) its entities stay "available" while review_status may stall at NONE,
# suppressing real detections without triggering the Reolink fallback.

    - name: "Doorbell Smart Person"
      unique_id: doorbell_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% set occ = states('binary_sensor.doorbell_property_person_occupancy') %}
        {% set rev = states('sensor.doorbell_review_status') %}
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and occ not in ['unavailable', 'unknown'] %}
          {% if rev in ['unavailable', 'unknown'] %}
            {{ occ }}
          {% else %}
            {{ 'on' if occ == 'on' and rev == 'ALERT' else 'off' }}
          {% endif %}
        {% else %}
          {{ states('binary_sensor.doorbell_person') }}
        {% endif %}

    - name: "Front Left Smart Person"
      unique_id: front_left_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% set occ = states('binary_sensor.front_left_property_person_occupancy') %}
        {% set rev = states('sensor.front_left_review_status') %}
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and occ not in ['unavailable', 'unknown'] %}
          {% if rev in ['unavailable', 'unknown'] %}
            {{ occ }}
          {% else %}
            {{ 'on' if occ == 'on' and rev == 'ALERT' else 'off' }}
          {% endif %}
        {% else %}
          {{ states('binary_sensor.front_left_person') }}
        {% endif %}

    - name: "Front Right Smart Person"
      unique_id: front_right_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% set occ = states('binary_sensor.front_right_property_person_occupancy') %}
        {% set rev = states('sensor.front_right_review_status') %}
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and occ not in ['unavailable', 'unknown'] %}
          {% if rev in ['unavailable', 'unknown'] %}
            {{ occ }}
          {% else %}
            {{ 'on' if occ == 'on' and rev == 'ALERT' else 'off' }}
          {% endif %}
        {% else %}
          {{ states('binary_sensor.front_right_person') }}
        {% endif %}

    # The living_room_* fallback below is NOT a typo: the Reolink device at
    # 192.168.98.53 IS the back-left camera (TrackMix PoE, device named "Back
    # Left"). It was renamed in HA but its entity_ids were never migrated, so
    # all of its Reolink entities are still named living_room_*. The same
    # applies to camera.living_room_fluent_lens_1, which automations/llm_vision
    # analyses -- that is the back-left camera, not an indoor one.
    - name: "Back Left Smart Person"
      unique_id: back_left_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% set occ = states('binary_sensor.back_left_person_occupancy') %}
        {% set rev = states('sensor.back_left_review_status') %}
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and occ not in ['unavailable', 'unknown'] %}
          {% if rev in ['unavailable', 'unknown'] %}
            {{ occ }}
          {% else %}
            {{ 'on' if occ == 'on' and rev == 'ALERT' else 'off' }}
          {% endif %}
        {% else %}
          {{ states('binary_sensor.living_room_person') }}
        {% endif %}

    - name: "Back Right Smart Person"
      unique_id: back_right_smart_person
      device_class: occupancy
      delay_off: "{{ states('input_number.security_sensor_debounce_seconds') | int(10) }}"
      state: >
        {% set occ = states('binary_sensor.back_right_person_occupancy') %}
        {% set rev = states('sensor.back_right_review_status') %}
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and occ not in ['unavailable', 'unknown'] %}
          {% if rev in ['unavailable', 'unknown'] %}
            {{ occ }}
          {% else %}
            {{ 'on' if occ == 'on' and rev == 'ALERT' else 'off' }}
          {% endif %}
        {% else %}
          {{ states('binary_sensor.back_right_person') }}
        {% endif %}

# Smart camera selectors: each resolves to the entity_id of the best available
# camera feed for a given view. Mirrors the *_smart_person detection fallback —
# prefer Frigate (camera.<name>), fall back to the Reolink substream when Frigate
# is unavailable/unknown or the prefer_frigate_sensors override is off. Security
# automations snapshot / proxy whatever entity_id this returns. See CLAUDE.md.
- sensor:
    - name: "Doorbell Smart Camera"
      unique_id: doorbell_smart_camera
      icon: mdi:cctv
      state: >
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and states('camera.doorbell') not in ['unavailable', 'unknown'] %}
          camera.doorbell
        {% else %}
          camera.doorbell_fluent
        {% endif %}

    - name: "Front Left Smart Camera"
      unique_id: front_left_smart_camera
      icon: mdi:cctv
      state: >
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and states('camera.front_left') not in ['unavailable', 'unknown'] %}
          camera.front_left
        {% else %}
          camera.front_left_fluent_lens_0
        {% endif %}

    - name: "Front Right Smart Camera"
      unique_id: front_right_smart_camera
      icon: mdi:cctv
      state: >
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and states('camera.front_right') not in ['unavailable', 'unknown'] %}
          camera.front_right
        {% else %}
          camera.front_right_fluent_lens_0
        {% endif %}

    - name: "Back Left Smart Camera"
      unique_id: back_left_smart_camera
      icon: mdi:cctv
      state: >
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and states('camera.back_left') not in ['unavailable', 'unknown'] %}
          camera.back_left
        {% else %}
          camera.living_room_fluent_lens_0
        {% endif %}

    - name: "Back Right Smart Camera"
      unique_id: back_right_smart_camera
      icon: mdi:cctv
      state: >
        {% if is_state('input_boolean.prefer_frigate_sensors', 'on') and states('camera.back_right') not in ['unavailable', 'unknown'] %}
          camera.back_right
        {% else %}
          camera.back_right_fluent_lens_0
        {% endif %}

- trigger:
    trigger: event
    event_type: tasker_event
  sensor:
    - name: Tasker State
      state: "{{trigger.event.data.state}}"
